{% extends 'base.html' %}

{% block title %}500 - Server Error | 3D Print Calculator{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-8 col-lg-6 text-center">
        <div class="card shadow-sm border-0 p-4 p-md-5">
            <div class="display-1 text-warning fw-bold mb-3">500</div>
            <h1 class="h3 mb-3">Internal Server Error</h1>
            <p class="text-muted mb-4">
                Something went wrong on our end while processing your request. Our system logged the error.
            </p>
            <div class="d-flex justify-content-center gap-2">
                <a href="{% url 'calculator' %}" class="btn btn-primary">
                    <i class="bi bi-house me-1"></i> Return Home
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
